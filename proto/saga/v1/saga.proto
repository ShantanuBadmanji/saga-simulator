syntax = "proto3";

package saga.v1;

option go_package = ";sagav1";

service Saga {
  rpc StartSaga(StartSagaRequest) returns (StartSagaResponse);
  rpc GetSaga(GetSagaRequest) returns (GetSagaResponse);
}

message StartSagaRequest {
  string           order_id          = 1;
  FailureInjection failure_injection = 2;
}

message StartSagaResponse {
  string saga_id = 1;
}

message GetSagaRequest {
  string saga_id = 1;
}

message GetSagaResponse {
  string                 saga_id      = 1;
  SagaStatus             status       = 2;
  SagaStep               current_step = 3;
  repeated StepExecution steps        = 4;
}

enum SagaStatus {
  SAGA_STATUS_UNSPECIFIED  = 0;
  SAGA_STATUS_RUNNING      = 1;
  SAGA_STATUS_COMPLETED    = 2;
  SAGA_STATUS_COMPENSATING = 3;
  SAGA_STATUS_COMPENSATED  = 4;
  SAGA_STATUS_FAILED       = 5;
}

enum SagaStep {
  SAGA_STEP_UNSPECIFIED       = 0;
  SAGA_STEP_CREATE_ORDER      = 1;
  SAGA_STEP_RESERVE_INVENTORY = 2;
  SAGA_STEP_CHARGE_PAYMENT    = 3;
  SAGA_STEP_RELEASE_INVENTORY = 4;
  SAGA_STEP_REFUND_PAYMENT    = 5;
  SAGA_STEP_COMPLETE          = 6;
}

message StepExecution {
  SagaStep   step              = 1;
  StepStatus status            = 2;
  string     error             = 3;
  int32      attempt           = 4;
  int64      started_at_unix   = 5;
  int64      completed_at_unix = 6;
}

enum StepStatus {
  STEP_STATUS_UNSPECIFIED  = 0;
  STEP_STATUS_PENDING      = 1;
  STEP_STATUS_RUNNING      = 2;
  STEP_STATUS_COMPLETED    = 3;
  STEP_STATUS_FAILED       = 4;
  STEP_STATUS_COMPENSATING = 5;
  STEP_STATUS_COMPENSATED  = 6;
}

message FailureInjection {
  SagaStep    step = 1;
  FailureMode mode = 2;
}

enum FailureMode {
  FAILURE_MODE_UNSPECIFIED = 0;
  FAILURE_MODE_ERROR       = 1;
  FAILURE_MODE_TIMEOUT     = 2;
}