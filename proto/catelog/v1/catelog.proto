syntax = "proto3";

package catalog.v1;

option go_package = ";catalogv1";

service Catelog {
  rpc GetSKUPrice(GetSKUPriceRequest) returns (GetSKUPriceResponse);
}

message GetSKUPriceRequest {
  string sku_id = 1;
}

message GetSKUPriceResponse {
  string sku_id   = 1;
  double price    = 2;
  string currency = 3;
}